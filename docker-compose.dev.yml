# Development-specific overrides
services:
  backend:
    build:
      target: builder
    volumes:
      - ../gym-study-back/src:/app/src:cached
      - ../gym-study-back/package.json:/app/package.json
      - backend_node_modules:/app/node_modules
    command: npm run dev
    environment:
      NODE_ENV: development

  frontend:
    build:
      target: builder
    volumes:
      - ../gym-study-front/src:/app/src:cached
      - ../gym-study-front/public:/app/public:cached
      - ../gym-study-front/package.json:/app/package.json
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    environment:
      NODE_ENV: development

volumes:
  backend_node_modules:
  frontend_node_modules:
